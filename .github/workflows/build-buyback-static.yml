name: Build buyback static output
on:
  push:
    branches:
      - draft/vykup-astra6-final
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Copy built site to repository root
        run: |
          cp -a dist/. .
          rm -f .github/workflows/build-buyback-static.yml
      - name: Commit built site
        run: |
          git config user.name "ScoutPC Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build static site with buyback page"
            git push origin HEAD:draft/vykup-astra6-final
          fi
