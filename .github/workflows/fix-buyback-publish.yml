name: Publish buyback fix

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/vykup-videokart-i-komplektuyushchih-krasnodar.astro'
      - 'src/content/vykup-videokart-i-komplektuyushchih-krasnodar.html'
      - 'src/styles/vykup-videokart-i-komplektuyushchih-krasnodar.css'
      - 'public/images/scoutpc-buyback.avif'
      - 'public/images/scoutpc-buyback-v2.avif'
      - '.github/workflows/fix-buyback-publish.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Switch buyback hero to cache-busted asset
        run: |
          sed -i 's#scoutpc-buyback\.avif#scoutpc-buyback-v2.avif#g' src/content/vykup-videokart-i-komplektuyushchih-krasnodar.html
          sed -i 's#scoutpc-buyback\.avif#scoutpc-buyback-v2.avif#g' src/pages/vykup-videokart-i-komplektuyushchih-krasnodar.astro
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Copy built site to repository root
        run: cp -a dist/. ./
      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish cache-busted buyback hero"
            git push
          fi
